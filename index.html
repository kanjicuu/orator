<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orator</title>
<meta name="theme-color" content="#F2EADA">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root {
  --paper: #F2EADA; --panel: #E8DEC9; --ink: #1F1A14; --faint: rgba(31,26,20,.28);
  --soft: rgba(31,26,20,.55); --line: rgba(31,26,20,.12);
  --accent: #1E4634; --mark: #6C2130;
  --serif: "Hoefler Text", "Iowan Old Style", Georgia, "Hiragino Mincho ProN", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
body { -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:disabled { opacity: .35; cursor: default; }
.wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 120px; }
h1 { font-size: 34px; margin: 24px 4px 16px; }
.caps { font-size: 10px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--soft); }
.card { background: color-mix(in srgb, var(--panel) 70%, transparent); border-radius: 14px; }
.row { display: flex; align-items: center; gap: 12px; }
.muted { color: var(--soft); }
.serif { font-family: var(--serif); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 3px 9px; border-radius: 999px;
  border: 1px solid currentColor; color: var(--accent); }
.btn { padding: 7px 14px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 12%, transparent);
  color: var(--accent); font-weight: 600; }
.btn.mark { background: color-mix(in srgb, var(--mark) 12%, transparent); color: var(--mark); }
.btn.solid { background: var(--accent); color: var(--paper); }
a { color: var(--accent); }

/* Stats card */
.stats { display: flex; padding: 14px 0; margin-bottom: 14px; }
.stats > button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.stats .sep { width: 1px; background: var(--line); margin: 4px 0; }
.num { font-family: var(--serif); font-size: 30px; line-height: 1; }
.unit { font-family: var(--serif); font-size: 12px; color: var(--soft); margin-left: 4px; }

.search { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: #fffaf0; font: inherit; margin-bottom: 14px; }
.hit { display: block; width: 100%; text-align: left; padding: 12px 18px; background: color-mix(in srgb, var(--panel) 55%, transparent);
  border-bottom: 1px solid var(--line); }
.hit:hover { background: color-mix(in srgb, var(--panel) 85%, transparent); }
.hit .where { font-size: 11px; color: var(--mark); }
.hit .en { font-family: var(--serif); font-size: 16px; margin: 2px 0; }
.hit .ja { font-size: 12px; color: var(--soft); }
mark { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--ink); border-radius: 3px; }

/* Lists */
.list { border-radius: 14px; overflow: hidden; }
.item { display: block; width: 100%; text-align: left; padding: 14px 18px; background: color-mix(in srgb, var(--panel) 55%, transparent);
  border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item:hover { background: color-mix(in srgb, var(--panel) 85%, transparent); }
.speaker { font-size: 11px; font-weight: 600; letter-spacing: .12em; color: var(--mark); }
.stitle { font-family: var(--serif); font-size: 22px; margin: 2px 0; }
.back { color: var(--accent); font-weight: 600; margin: 12px 4px; display: inline-block; }

/* Player */
#player { position: fixed; inset: 0; background: var(--paper); display: none; flex-direction: column; z-index: 10; }
#player.open { display: flex; }
.ptop { display: flex; align-items: center; gap: 10px; padding: 10px 16px; max-width: 760px; width: 100%; margin: 0 auto; }
.ptop .title { flex: 1; text-align: center; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modes { display: flex; background: var(--panel); border-radius: 9px; padding: 2px; margin: 0 16px 6px; max-width: 728px; align-self: center; width: calc(100% - 32px); }
.modes button { flex: 1; padding: 6px 0; font-size: 13px; border-radius: 7px; }
.modes button.on { background: var(--paper); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.passes { display: flex; justify-content: space-around; margin: 0 16px 6px; font-size: 11px; }
.passes div { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.banner { display: flex; align-items: center; gap: 10px; padding: 8px 20px; background: color-mix(in srgb, var(--panel) 60%, transparent); }
#stage { flex: 1; overflow-y: auto; }
.stage-in { max-width: 760px; margin: 0 auto; padding: 20px 20px 45vh; }
.sent { padding: 9px 0; cursor: pointer; }
.sent .en { font-family: var(--serif); font-size: 19px; line-height: 1.45; color: var(--faint); }
.sent .ja { font-size: 14px; line-height: 1.6; color: var(--faint); margin-top: 4px; }
.sent.cur .en { color: var(--ink); }
.sent.cur .ja { color: color-mix(in srgb, var(--ink) 75%, transparent); }
.sent .who { font-size: 10px; font-weight: 600; letter-spacing: .12em; color: color-mix(in srgb, var(--mark) 50%, transparent); margin: 10px 0 4px; }
.sent.cur .who { color: var(--mark); }
.sent .meta { display: flex; gap: 8px; margin-top: 6px; align-items: center; }
.sent .meta .chip { color: #888; }
.sent.cur .meta .chip { color: var(--accent); }
.blank { color: var(--mark); }
.flag { color: var(--mark); }
.intro { padding: 14px; margin-bottom: 16px; cursor: pointer; }
.center { text-align: center; padding-top: 16vh; }
.big-ja { font-size: 20px; line-height: 1.7; }
.big-en { font-family: var(--serif); font-size: 21px; line-height: 1.5; }
.controls { background: var(--panel); padding: 10px 20px calc(10px + env(safe-area-inset-bottom)); }
.controls-in { max-width: 720px; margin: 0 auto; }
.seek { width: 100%; accent-color: var(--accent); }
.times { display: flex; justify-content: space-between; font-size: 11px; color: var(--soft); font-variant-numeric: tabular-nums; }
.transport { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
.transport button { font-size: 22px; width: 48px; height: 48px; display: grid; place-items: center; }
.transport .play { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: var(--paper); font-size: 26px; }
.rate { font-size: 14px !important; font-weight: 700; }
.on-accent { color: var(--accent); }
.dim { color: var(--faint); }

/* Sheets */
#sheet { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; z-index: 20; align-items: flex-end; justify-content: center; }
#sheet.open { display: flex; }
#sheet .body { background: var(--paper); width: 100%; max-width: 760px; max-height: 80vh; overflow-y: auto;
  border-radius: 16px 16px 0 0; padding: 20px 20px 40px; }
.sec { margin: 16px 0 6px; font-size: 13px; font-weight: 700; color: var(--soft); }

/* History */
.duel { padding: 16px 8px; text-align: center; margin-bottom: 14px; }
.triple { display: flex; align-items: flex-end; }
.triple > div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.verdict { font-family: var(--serif); font-weight: 600; margin-top: 12px; }
.cal { padding: 14px; margin-bottom: 14px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
.cal-grid .dow { font-size: 11px; color: var(--soft); text-align: center; }
.cal-grid .d { min-height: 42px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 11px; background: var(--paper); cursor: pointer; }
.cal-grid .d b { font-size: 11px; font-variant-numeric: tabular-nums; }
.cal-grid .d.today { outline: 1.5px solid var(--mark); }
.rank { padding: 14px; }
.rank .r { display: flex; padding: 7px 10px; border-radius: 8px; font-variant-numeric: tabular-nums; }
.rank .r.me { background: color-mix(in srgb, var(--accent) 15%, transparent); }
.rank .r .n { width: 28px; font-family: var(--serif); }

/* Setup */
.setup { max-width: 520px; margin: 12vh auto; padding: 24px; }
.setup input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #fffaf0; font: inherit; margin: 6px 0 14px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--paper);
  padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; z-index: 30; pointer-events: none; }
.toast.show { opacity: .92; }
.kbd { font-size: 11px; color: var(--soft); margin-top: 18px; line-height: 1.8; }
/* Books (Japanese RSVP) */
.pbar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 8px; }
.pbar > i { display: block; height: 100%; background: var(--accent); }
.seg { display: flex; background: var(--panel); border-radius: 9px; padding: 2px; margin: 10px 0; }
.seg button { flex: 1; padding: 6px 0; font-size: 13px; border-radius: 7px; }
.seg button.on { background: var(--paper); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.sum { font-size: 15px; line-height: 1.9; padding: 16px 18px; }
.bigbtn { display: block; width: 100%; padding: 14px; font-size: 16px; margin: 14px 0; }
#reader { position: fixed; inset: 0; background: var(--paper); display: none; flex-direction: column; z-index: 12;
  --name: #7A6412; --jserif: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif; }
#reader.open { display: flex; }
.rtop { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.rtop select { flex: 1; min-width: 0; font: 600 14px var(--sans); color: var(--ink); background: transparent;
  border: 1px solid transparent; border-radius: 6px; padding: 4px; }
.rtop select:hover { border-color: var(--line); }
.rkeys { font-size: 12px; color: var(--soft); white-space: nowrap; }
#rstage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden;
  cursor: pointer; user-select: none; -webkit-user-select: none; }
#rg1, #rg2 { position: absolute; background: var(--mark); opacity: .75; }
#rstage:not(.vert) #rg1, #rstage:not(.vert) #rg2 { width: 2px; height: 14px; left: calc(50% - 1px); }
#rstage:not(.vert) #rg1 { top: calc(50% - var(--fs) * .95); }
#rstage:not(.vert) #rg2 { top: calc(50% + var(--fs) * .95 - 14px); }
#rstage.vert #rg1, #rstage.vert #rg2 { height: 2px; width: 14px; top: calc(50% - 1px); }
#rstage.vert #rg1 { left: calc(50% - var(--fs) * .95); }
#rstage.vert #rg2 { left: calc(50% + var(--fs) * .95 - 14px); }
#rstage.noguide #rg1, #rstage.noguide #rg2 { display: none; }
#rword { font-family: var(--jserif); font-size: var(--fs); line-height: 1.2; white-space: nowrap; text-align: center; }
#rstage.vert #rword { writing-mode: vertical-rl; text-orientation: upright; }
#rword .nm { color: var(--name); font-weight: 700; }
#rword.title { font-size: calc(var(--fs) * .6); white-space: normal; max-width: 80vw; line-height: 1.5; }
#rstage.vert #rword.title { writing-mode: horizontal-tb; }
#rlabel { position: absolute; left: 50%; transform: translateX(-50%); top: calc(50% + var(--fs) * .95 + 6px);
  font: 700 14px var(--sans); color: var(--name); white-space: nowrap; }
#rstage.vert #rlabel { top: auto; bottom: calc(50% - var(--fs) * .95 - 34px); }
#rhint { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--soft); }
#rctx { max-height: 24vh; overflow: auto; padding: 0 18px 8px; font-family: var(--jserif); font-size: 15px; line-height: 1.9;
  color: var(--faint); display: none; max-width: 900px; width: 100%; margin: 0 auto; }
#rctx.on { display: block; }
#rctx mark { background: none; color: var(--ink); border-bottom: 2px solid var(--mark); border-radius: 0; }
.rfoot { background: var(--panel); padding: 6px 16px calc(8px + env(safe-area-inset-bottom)); }
.rfoot-in { max-width: 900px; margin: 0 auto; }
#rbar { padding: 7px 0; cursor: pointer; }
#rbar > div { height: 4px; background: var(--line); border-radius: 2px; position: relative; }
#rfill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 2px; width: 0; }
.rmeta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--soft);
  font-variant-numeric: tabular-nums; margin-bottom: 8px; }
.rrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 13px; margin-bottom: 8px; }
.rrow label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.rrow select { font: 13px var(--sans); padding: 4px 6px; border-radius: 7px; border: 1px solid var(--line); background: #fffaf0; color: var(--ink); }
.rrow input[type=range] { accent-color: var(--accent); width: 120px; }
.rrow input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.rrow .val { min-width: 62px; font-variant-numeric: tabular-nums; }
.rplay { background: var(--accent); color: var(--paper); border-radius: 10px; padding: 8px 16px; font-weight: 600; min-width: 92px; }
.rmore { display: none; }
@media (max-width: 700px) { .rkeys { display: none; } .rrow input[type=range] { width: 90px; }
  .rmore { display: inline-block; } .rrow.opt:not(.show) { display: none; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="player"></div>
<div id="reader"></div>
<div id="sheet"><div class="body"></div></div>
<div class="toast" id="toast"></div>
<audio id="audio" preload="auto"></audio>
<script>
"use strict";
/*
 * Orator for the web — same content and practice log as the iPhone app.
 * Content: private repo kanjicuu/orator-data (index.json, <speech>/speech.json, <speech>/NN.m4a),
 * read through the GitHub contents API with a token kept in this browser only.
 * Practice log: orator.json in kanjicuu/screen-memo-data, merged with the same rules as
 * App/Journal.swift (latest `at` wins for marks/passes/relisten; each device owns its listening row).
 */
const CONTENT_REPO = "kanjicuu/orator-data";
const LOG_REPO = "kanjicuu/screen-memo-data";
const INTERVALS = [1, 3, 7, 16, 35, 80];
const MODES = [["none", "なし"], ["english", "英"], ["both", "英日"], ["cloze", "穴埋め"], ["japaneseFirst", "日→英"]];
const PASS_MODES = ["none", "english", "both", "none"];
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const clock = t => { t = Math.max(0, Math.floor(t)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; };
const today = () => dayStr(new Date());
function dayStr(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function dayAfter(n, from) { const d = from ? new Date(from) : new Date(); d.setDate(d.getDate() + n); return dayStr(d); }
function parseDay(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1600); }

// ---------- GitHub ----------
// Local test: http://localhost:…/?local reads content from ../publish and skips log sync.
const LOCAL = location.hostname === "localhost" && new URLSearchParams(location.search).has("local");
const token = () => LOCAL ? "local" : store.get("token", "");
async function gh(repo, path, opts = {}) {
  if (LOCAL) return repo === CONTENT_REPO ? fetch("../publish/" + path, { cache: "no-store" }) : new Response("", { status: 503 });
  const r = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
    method: opts.method || "GET",
    headers: { Authorization: `Bearer ${token()}`, Accept: opts.raw ? "application/vnd.github.raw" : "application/vnd.github+json",
               ...(opts.body ? { "Content-Type": "application/json" } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined, cache: "no-store",
  });
  return r;
}
function b64utf8(str) { const bytes = new TextEncoder().encode(str); let bin = ""; for (const b of bytes) bin += String.fromCharCode(b); return btoa(bin); }
function utf8b64(b64) { const bin = atob(b64.replace(/\s/g, "")); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }

// ---------- Content ----------
let speeches = [], books = [];
// Cached JSON from the content repo. Default: network first, last copy when offline.
// With `key` (a versioned name for a big file): cache first, so book.json downloads once per version.
async function contentJSON(path, key) {
  const cache = await caches.open("orator-json").catch(() => null);
  if (key) { const hit = await cache?.match("/" + key); if (hit) return JSON.parse(await hit.text()); }
  try {
    const r = await gh(CONTENT_REPO, path, { raw: true });
    if (!r.ok) throw new Error(r.status);
    const text = await r.text();
    cache?.put("/" + (key || path), new Response(text));
    return JSON.parse(text);
  } catch (e) {  // offline: last copy
    const hit = await cache?.match("/" + path);
    if (hit) return JSON.parse(await hit.text());
    throw e;
  }
}
async function loadContent() {
  const index = await contentJSON("index.json");
  const [list, metas] = await Promise.all([
    Promise.all(index.speeches.map(async id => ({ ...(await contentJSON(`${id}/speech.json`)), folder: id }))),
    Promise.all((index.books || []).map(id => contentJSON(`books/${id}/meta.json`).catch(() => null))),
  ]);
  speeches = list.sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || a.id.localeCompare(b.id));
  books = metas.filter(Boolean).sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || a.id.localeCompare(b.id));
}
const audioURLs = {};
async function audioURL(speech, track) {
  const path = `${speech.folder}/${track.file}`;
  if (audioURLs[path]) return audioURLs[path];
  const cache = await caches.open("orator-audio").catch(() => null);
  const hit = await cache?.match("/" + path);
  let blob = hit ? await hit.blob() : null;
  if (!blob) {
    toast("音声を読み込み中…");
    const r = await gh(CONTENT_REPO, path, { raw: true });
    if (!r.ok) throw new Error("audio " + r.status);
    blob = await r.blob();
    cache?.put("/" + path, new Response(blob, { headers: { "Content-Type": "audio/mp4" } }));
  }
  // Servers label .m4a variously (octet-stream from GitHub, mp4a-latm locally); browsers want audio/mp4.
  return (audioURLs[path] = URL.createObjectURL(new Blob([blob], { type: "audio/mp4" })));
}

// ---------- Journal (same shape and merge as App/Journal.swift) ----------
const device = () => "web-" + store.get("device", "mac");
let J = store.get("journal", { updatedAt: "", marks: {}, listening: {}, passes: {}, relisten: {} });
J.relisten ||= {}; J.reading ||= {}; J.readMax ||= {};
const nowISO = () => new Date().toISOString();
function merged(a, b) {
  const out = JSON.parse(JSON.stringify(a));
  for (const [id, m] of Object.entries(b.marks || {})) if ((out.marks[id]?.at || "") < m.at) out.marks[id] = m;
  for (const [id, p] of Object.entries(b.passes || {})) if ((out.passes[id]?.at || "") < p.at) out.passes[id] = p;
  out.relisten ||= {};
  for (const [id, r] of Object.entries(b.relisten || {})) if ((out.relisten[id]?.at || "") < r.at) out.relisten[id] = r;
  // Books: reading position per book (latest `at` wins), furthest offset per chapter (larger wins).
  out.reading ||= {}; out.readMax ||= {};
  for (const [id, r] of Object.entries(b.reading || {})) if ((out.reading[id]?.at || "") < (r?.at || "")) out.reading[id] = r;
  for (const [k, n] of Object.entries(b.readMax || {})) out.readMax[k] = Math.max(+n || 0, out.readMax[k] || 0);
  for (const [dev, days] of Object.entries(b.listening || {})) {
    if (dev === device()) continue;
    out.listening[dev] ||= {};
    for (const [d, s] of Object.entries(days)) out.listening[dev][d] = Math.max(s, out.listening[dev][d] || 0);
  }
  out.updatedAt = a.updatedAt > (b.updatedAt || "") ? a.updatedAt : b.updatedAt;
  return out;
}
function saveJ(pushAfter) { J.updatedAt = nowISO(); store.set("journal", J); if (pushAfter != null) schedulePush(pushAfter); }
let pushTimer;
function schedulePush(sec) { clearTimeout(pushTimer); pushTimer = setTimeout(syncNow, sec * 1000); }
async function syncNow() {
  if (!token()) return;
  for (let k = 0; k < 3; k++) {
    try {
      const r = await gh(LOG_REPO, "orator.json");
      let remote = { marks: {}, listening: {}, passes: {}, relisten: {} }, sha;
      if (r.status === 200) { const o = await r.json(); sha = o.sha; remote = JSON.parse(utf8b64(o.content)); }
      else if (r.status !== 404) return;
      J = merged(J, remote);
      store.set("journal", J);
      const body = { message: `Orator: practice log (${device()})`, content: b64utf8(JSON.stringify(sortKeys(J), null, 2) + "\n") };
      if (sha) body.sha = sha;
      const w = await gh(LOG_REPO, "orator.json", { method: "PUT", body });
      if (w.ok) { render(); return; }
      if (w.status !== 409 && w.status !== 422) return;
    } catch { return; }
  }
}
function sortKeys(o) { if (Array.isArray(o) || o === null || typeof o !== "object") return o;
  return Object.fromEntries(Object.keys(o).sort().map(k => [k, sortKeys(o[k])])); }

const markId = (track, i) => `${track.id}#${i}`;

  else { J.marks[id] = { track: track.id, i, t: s.t, en: s.en, ja: s.ja, at: nowISO() }; toast("🚩 聴き取れなかった"); }

const relistenDue = track => { const r = J.relisten[track.id]; return !!r && r.due <= today(); };

// ---------- Player state ----------
const A = $("#audio");
const P = {

// Review
async function startReview(list) {

      if ((charLen(buf) >= RS.minc && cnt >= RS.group) || RE_SENT.test(buf)) { merged.push(buf); buf = ""; cnt = 0; }
    }
    if (buf) { if (merged.length && charLen(buf) < RS.minc) merged[merged.length - 1] += buf; else merged.push(buf); }
    merged.forEach((t, k) => { res.push({ t, para: pi, off, len: charLen(t), paraEnd: k === merged.length - 1 }); off += t.length; });
  });
  return res;
}
function findNames(t) {
  const hits = [];
  for (const n of R.names) {
    let from = 0, at;
    while ((at = t.indexOf(n.name, from)) !== -1) {
      const end = at + n.name.length, before = t[at - 1] || "", after = t[end] || "";
      const ok = !KATA.test(n.name[0]) || (!KATA.test(before) && (after === "・" || !KATA.test(after)));
      if (ok && !hits.some(h => at < h.end && end > h.at)) hits.push({ at, end, n });
      from = at + 1;
    }
  }
  return hits.sort((a, b) => a.at - b.at);
}
const tokAt = off => { let k = 0; while (k + 1 < R.toks.length && R.toks[k + 1].off <= off) k++; return k; };
const setText = (el, s) => { if (el && el.textContent !== s) el.textContent = s; };

function buildReader() {
  if ($("#rword")) return;
  const opt = (v, t) => v.map((x, k) => `<option value="${x}">${t[k]}</option>`).join("");
  $("#reader").innerHTML = `<div class="rtop"><button class="btn" id="rclose">⌄ 閉じる</button><select id="rch" aria-label="章"></select>
      <span class="rkeys">Space 再生/停止 · ←→ 1文節 · Shift+←→ 段落 · ↑↓ 速度 · V 縦横 · C 文脈</span></div>
    <div id="rstage"><div id="rg1"></div><div id="rg2"></div><div id="rword"></div><div id="rlabel"></div><div id="rhint"></div></div>
    <div id="rctx"></div>
    <div class="rfoot"><div class="rfoot-in">
      <div id="rbar"><div><div id="rfill"></div></div></div>
      <div class="rmeta"><span id="rpos"></span><span id="rrem"></span></div>
      <div class="rrow">
        <button id="rrestart" class="btn" title="章の先頭へ">⏮</button><button id="rplay" class="rplay">▶ 再生</button>
        <label>速度 <input type="range" id="rspeed" min="300" max="3000" step="50"><span class="val" id="rspeedv"></span></label>
        <button class="btn rmore" id="rmore">表示設定</button>
      </div>
      <div class="rrow opt">
        <label>まとめる <select id="rgroup">${opt([1, 2, 3], ["1文節ずつ", "2文節ずつ", "3文節ずつ"])}</select></label>
        <label>最小 <select id="rminc">${opt([1, 2, 3, 4, 5], ["1字以上", "2字以上", "3字以上", "4字以上", "5字以上"])}</select></label>
        <label>文字 <input type="range" id="rfont" min="32" max="96" step="2"><span class="val" id="rfontv"></span></label>
        <label><input type="checkbox" id="rpunct"> 句読点で間をとる</label>
      </div>
      <div class="rrow opt">
        <label><input type="checkbox" id="rnameColor"> 名前を色分け</label>
        <label>人物ラベル <select id="rlabelMode">${opt([3, 1, 999, 0], ["章の最初3回", "章の最初1回", "毎回", "表示しない"])}</select></label>
        <label><input type="checkbox" id="rnameSlow"> 名前で少し長く</label>
        <label><input type="checkbox" id="rvert"> 縦表示</label>
        <label><input type="checkbox" id="rguide"> 注視点ガイド</label>
        <label><input type="checkbox" id="rctxOn"> 文脈表示</label>
      </div></div></div>`;
  $("#rclose").onclick = closeReader;
  $("#rplay").onclick = e => { e.currentTarget.blur(); rToggle(); };
  $("#rrestart").onclick = e => { e.currentTarget.blur(); rPause(); rSeek(0); R.titleCard = true; rShow(); };
  $("#rmore").onclick = () => document.querySelectorAll(".rrow.opt").forEach(r => r.classList.toggle("show"));
  $("#rstage").onclick = rToggle;
  $("#rbar").onclick = e => { const r = e.currentTarget.getBoundingClientRect(), target = (e.clientX - r.left) / r.width * R.meta.chapters[R.ch].chars;
    const k = R.toks.findIndex(t => t.off >= target); rSeek(k < 0 ? R.toks.length - 1 : k); };
  $("#rch").onchange = e => { const was = R.playing; rPause(); rLoadChapter(+e.target.value, 0); if (was) rPlay(); };
  $("#rspeed").oninput = e => setRS("speed", +e.target.value);
  $("#rfont").oninput = e => setRS("font", +e.target.value);
  $("#rgroup").onchange = e => setRS("group", +e.target.value, true);
  $("#rminc").onchange = e => setRS("minc", +e.target.value, true);
  $("#rlabelMode").onchange = e => setRS("labelMode", +e.target.value);
  for (const k of ["punct", "nameColor", "nameSlow", "vert", "guide"]) $("#r" + k).onchange = e => setRS(k, e.target.checked);
  $("#rctxOn").onchange = e => setRS("ctx", e.target.checked);
  window.addEventListener("resize", () => { if (readerOpen()) rFit(); });
}
function applyRS() {
  $("#rspeed").value = RS.speed; $("#rspeedv").textContent = RS.speed + "字/分";
  $("#rfont").value = RS.font; $("#rfontv").textContent = RS.font + "px";
  $("#rgroup").value = RS.group; $("#rminc").value = RS.minc; $("#rlabelMode").value = RS.labelMode;
  for (const k of ["punct", "nameColor", "nameSlow", "vert", "guide"]) $("#r" + k).checked = RS[k];
  $("#rctxOn").checked = RS.ctx;
  const st = $("#rstage"); st.style.setProperty("--fs", RS.font + "px");
  st.classList.toggle("vert", RS.vert); st.classList.toggle("noguide", !RS.guide);
  $("#rctx").classList.toggle("on", RS.ctx);
}
function setRS(k, v, retok) {
  RS[k] = v; store.set("rsvp", RS); applyRS();
  if (!R.toks.length) return;
  if (retok) { const off = R.toks[R.i].off; R.toks = rTokenize(R.data.chapters[R.ch]); R.labelCount = {}; R.i = tokAt(off); }
  rShow();
}
async function openReader(id, k, off) {
  const meta = books.find(b => b.id === id); if (!meta) return;
  buildReader(); applyRS();
  $("#reader").classList.add("open");
  if (R.meta?.id !== id || !R.data) {
    rPause(); R.meta = meta; R.data = null; R.toks = [];
    $("#rword").className = ""; $("#rword").textContent = "読み込み中…"; setText($("#rlabel"), ""); setText($("#rhint"), "");
    try { R.data = await loadBookData(meta); } catch (e) { toast("本を読み込めませんでした: " + e.message); closeReader(); return; }
    if (!readerOpen() || R.meta !== meta) return;
    R.names = [...(R.data.names || [])].sort((a, b) => b.name.length - a.name.length);
    const byId = Object.fromEntries(R.data.chapters.map(c => [c.id, c]));
    R.data.chapters = meta.chapters.map(c => byId[c.id] || { id: c.id, paras: [] });   // align with the contents
    R.before = []; let acc = 0; for (const c of meta.chapters) { R.before.push(acc); acc += c.chars; }
    $("#rch").innerHTML = meta.chapters.map((c, j) => `<option value="${j}">${esc(c.title)}（${(c.chars / 1000).toFixed(1)}千字）</option>`).join("");
  }
  rPause(); rLoadChapter(k, off);
  setText($("#rhint"), "Space または画面クリックで再生");
}
function closeReader() {
  if (R.playing) rPause(); else saveReading(3);
  $("#reader").classList.remove("open");
  render();
}
function rLoadChapter(k, off) {
  R.ch = k; $("#rch").value = k; R.labelCount = {};
  R.toks = rTokenize(R.data.chapters[k]);
  R.i = off > 0 ? tokAt(off) : 0;
  R.titleCard = R.i === 0;
  rShow();
}
function rFit() {
  const w = $("#rword"), st = $("#rstage");
  w.style.fontSize = "";
  const lim = RS.vert ? st.clientHeight * 0.9 : st.clientWidth * 0.94, size = RS.vert ? w.scrollHeight : w.scrollWidth;
  if (size > lim) w.style.fontSize = Math.floor(RS.font * lim / size) + "px";
}
function rShow() {  // touches only the chunk, its label and the progress line
  const w = $("#rword"); setText($("#rlabel"), "");
  if (R.titleCard) { w.className = "title"; w.textContent = R.meta.chapters[R.ch].title; rFit(); rMeta(); return; }
  w.className = "";
  const tk = R.toks[R.i]; if (!tk) { w.textContent = ""; rMeta(); return; }
  let html = esc(tk.t); const labels = [];
  const hits = findNames(tk.t); tk.hasName = hits.length > 0;
  if (hits.length) {
    if (RS.nameColor) { html = ""; let p = 0;
      for (const h of hits) { html += esc(tk.t.slice(p, h.at)) + `<span class="nm">${esc(tk.t.slice(h.at, h.end))}</span>`; p = h.end; }
      html += esc(tk.t.slice(p)); }
    for (const h of hits) {
      const key = h.n.label + "|" + h.n.name, seen = (R.labelCount[key] ||= new Set());
      seen.add(R.i);
      if ([...seen].filter(x => x <= R.i).length <= RS.labelMode && h.n.label) labels.push(h.n.label);
    }
  }
  w.innerHTML = html; setText($("#rlabel"), labels.join(" ／ "));
  rFit(); rMeta(); rContext();
}
function rMeta() {
  const ch = R.meta.chapters[R.ch], done = R.titleCard ? 0 : Math.min(R.toks[R.i]?.off ?? ch.chars, ch.chars);
  setText($("#rpos"), `${done.toLocaleString()} / ${ch.chars.toLocaleString()}字 · 本全体 ${pct((R.before[R.ch] + done) / R.meta.chars)}%`);
  const w = (ch.chars ? done / ch.chars * 100 : 0).toFixed(1) + "%"; if ($("#rfill").style.width !== w) $("#rfill").style.width = w;
  const restCh = (ch.chars - done) / RS.speed, restBook = (R.meta.chars - R.before[R.ch] - done) / RS.speed;
  const mmss = m => { const s = Math.round(m * 60); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  setText($("#rrem"), `章の残り 約${mmss(restCh)} · 本の残り 約${hm(restBook)}`);
}
function rContext() {
  if (!RS.ctx) return;
  const tk = R.toks[R.i]; if (!tk) return;
  let a = R.i, b = R.i; while (a > 0 && R.toks[a - 1].para === tk.para) a--; while (b + 1 < R.toks.length && R.toks[b + 1].para === tk.para) b++;
  const box = $("#rctx"); let html = "";
  for (let k = a; k <= b; k++) html += k === R.i ? `<mark>${esc(R.toks[k].t)}</mark>` : esc(R.toks[k].t);
  box.innerHTML = html; box.querySelector("mark")?.scrollIntoView({ block: "nearest" });
}
function rDur(tk) {
  let ms = Math.max(Math.max(tk.len, 1) / RS.speed * 60000, 90);
  if (RS.punct) { if (RE_SENT.test(tk.t)) ms *= 1.9; else if (/[、，,：]$/.test(tk.t)) ms *= 1.35; }
  if (tk.paraEnd) ms *= 1.5;
  if (RS.nameSlow && tk.hasName) ms *= 1.25;
  return ms;
}
function rStep() {  // one setTimeout per chunk, nothing else runs while reading
  if (!R.playing) return;
  if (R.titleCard) { R.titleCard = false; rShow(); R.timer = setTimeout(rStep, rDur(R.toks[R.i])); return; }
  if (R.i < R.toks.length - 1) {
    R.i++; rShow();
    if (Date.now() - R.saved > 30000) saveReading(null);
    R.timer = setTimeout(rStep, rDur(R.toks[R.i])); return;
  }
  chapterDone();
  if (R.ch < R.meta.chapters.length - 1) { rLoadChapter(R.ch + 1, 0); saveReading(null); R.timer = setTimeout(rStep, 1800); return; }
  rPause(); setText($("#rhint"), "この本を読み終えました");
}
function rPlay() {
  if (R.playing || !R.toks.length) return;
  R.playing = true; setText($("#rplay"), "❚❚ 停止"); setText($("#rhint"), "");
  if (R.i >= R.toks.length - 1 && !R.titleCard) R.i = 0;
  rShow(); R.saved = Date.now();
  R.timer = setTimeout(rStep, R.titleCard ? 1500 : rDur(R.toks[R.i]));
  navigator.wakeLock?.request("screen").then(l => { R.wake = l; }).catch(() => {});
}
function rPause() {
  clearTimeout(R.timer);
  if (!R.playing) return;
  R.playing = false; setText($("#rplay"), "▶ 再生");
  R.wake?.release().catch(() => {}); R.wake = null;
  saveReading(3);
  if (!R.titleCard) setText($("#rhint"), "Space または画面クリックで再生");
}
const rToggle = () => R.playing ? rPause() : rPlay();
function rSeek(k) {
  if (!R.toks.length) return;
  R.titleCard = false; R.i = Math.max(0, Math.min(R.toks.length - 1, k)); rShow();
  if (R.playing) { clearTimeout(R.timer); R.timer = setTimeout(rStep, rDur(R.toks[R.i]) + 250); }
}
function rParaStart(from, dir) {
  const t = R.toks, p = t[from].para; let k = from;
  if (dir < 0) { while (k > 0 && t[k - 1].para === p) k--; if (k === from && k > 0) { const pp = t[k - 1].para; while (k > 0 && t[k - 1].para === pp) k--; } return k; }
  while (k < t.length - 1 && t[k].para === p) k++; return k;
}
// Progress: written locally on pause, close, chapter end and every 30 s while reading; pushed on pause/close only.
function saveReading(pushAfter) {
  if (!R.meta || !R.toks.length) return;
  const id = R.meta.id, ch = R.meta.chapters[R.ch], off = R.titleCard ? 0 : R.toks[R.i].off, key = `${id}/${ch.id}`;
  R.saved = Date.now();
  const cur = J.reading[id];
  if (cur && cur.ch === ch.id && cur.off === off && (J.readMax[key] || 0) >= off) return;   // nothing new
  J.reading[id] = { ch: ch.id, off, at: nowISO() };
  if ((J.readMax[key] || 0) < off) J.readMax[key] = off;
  saveJ(pushAfter);
}
function chapterDone() {
  const ch = R.meta.chapters[R.ch], key = `${R.meta.id}/${ch.id}`;
  if ((J.readMax[key] || 0) < ch.chars) { J.readMax[key] = ch.chars; saveJ(null); }
}
function readerKey(e) {
  if (e.key === "Escape") return closeReader();
  if (e.code === "Space") { e.preventDefault(); rToggle(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); rSeek(e.shiftKey ? rParaStart(R.i, 1) : R.i + 1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); rSeek(e.shiftKey ? rParaStart(R.i, -1) : R.i - 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); setRS("speed", Math.min(3000, RS.speed + 100)); }
  else if (e.key === "ArrowDown") { e.preventDefault(); setRS("speed", Math.max(300, RS.speed - 100)); }
  else if (e.key === "v" || e.key === "V") setRS("vert", !RS.vert);
  else if (e.key === "c" || e.key === "C") setRS("ctx", !RS.ctx);
}

// Keyboard
document.addEventListener("keydown", e => {
  if (readerOpen()) {
    if (e.target.tagName === "SELECT" || (e.target.tagName === "INPUT" && e.target.type !== "checkbox")) return;
    return readerKey(e);
  }
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Escape") { if ($("#sheet").classList.contains("open")) closeSheet(); else if ($("#player").classList.contains("open")) closePlayer(); return; }
  if (!$("#player").classList.contains("open") || !P.track) return;
  const k = e.key.toLowerCase();
  if (k === " ") { e.preventDefault(); toggle(); }
  else if (k === "arrowleft") { e.preventDefault(); prevSentence(); }
  else if (k === "arrowright") { e.preventDefault(); nextSentence(); }
  else if (k === "arrowup") { e.preventDefault(); shiftMode(-1); }
  else if (k === "arrowdown") { e.preventDefault(); shiftMode(1); }
  else if (k === "f" && !P.review) flagCurrent();
  else if (k === "r") toggleRepeat();
  else if (P.review && P.hold === "grade" && (k === "1" || k === "2")) gradeReview(k === "2");
});
A.addEventListener("play", renderControls); A.addEventListener("pause", renderControls);
document.addEventListener("visibilitychange", () => { if (document.hidden) { savePos(); rPause(); saveReading(null); schedulePush(0); } else syncNow(); });
if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play", () => doPlay());
  navigator.mediaSession.setActionHandler("pause", () => doPause());
  navigator.mediaSession.setActionHandler("nexttrack", () => nextSentence());
  navigator.mediaSession.setActionHandler("previoustrack", () => prevSentence());
}

async function boot() {
  render();
  try { await loadContent(); } catch (e) { toast("読み込めませんでした: " + e.message); }
  render();
  syncNow();
  const last = store.get("last", null);
  for (const s of speeches) { const k = s.tracks.findIndex(t => t.id === last); if (k >= 0) { P.speech = s; P.trackIndex = k; } }
}
boot();
</script>
